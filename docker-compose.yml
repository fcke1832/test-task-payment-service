services:
  postgres:
    image: postgres:16-alpine
    container_name: payment_db
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: payment_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: payment_rabbit
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # Порт для приложений (AMQP)
      - "15672:15672" # Порт для UI (Management Plugin)
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 5

  dozzle:
    image: amir20/dozzle:latest
    container_name: payment_dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - rabbitmq
    restart: unless-stopped


  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment_api
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432      # внутренний порт контейнера
      - POSTGRES_DB=${POSTGRES_DB}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - API_KEY=${API_KEY}
      - APP_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Воркер для обработки платежей
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment_worker
    command: [ "/app/.venv/bin/python", "-m", "app.messaging.worker" ]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - API_KEY=${API_KEY}
      - APP_ENV=production
      - OUTBOX_POLL_INTERVAL=${OUTBOX_POLL_INTERVAL}
      - OUTBOX_BATCH_SIZE=${OUTBOX_BATCH_SIZE}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: