[project]
name = "test-task-payment-service"
version = "1.0.0"
description = "Async payment processing microservice (FastAPI, RabbitMQ, Outbox)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "faststream[rabbit]>=0.7.8",
    "httpx>=0.28.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.14"
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
